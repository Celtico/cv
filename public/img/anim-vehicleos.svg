<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="VehicleOS: cuadro digital, diagnóstico OBD-II y telemetría">
  <defs>
    <linearGradient id="bgV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--chakra-colors-ink-bg, #171310)"/>
      <stop offset="1" style="stop-color:var(--chakra-colors-ink-bg, #0c0a07)"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color:var(--chakra-colors-accent-dot, #CE8724)" stop-opacity="0.55"/>
      <stop offset="1" style="stop-color:var(--chakra-colors-accent-dot, #CE8724)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--chakra-colors-ink-bg, #12100b)"/>
      <stop offset="1" style="stop-color:var(--chakra-colors-ink-bg, #0e0c08)"/>
    </linearGradient>
    <style>
      @keyframes breatheV { 0%,100%{opacity:.10} 50%{opacity:.2} }
      @keyframes needleSpeed { 0%,100%{transform:rotate(-52deg)} 45%{transform:rotate(38deg)} 70%{transform:rotate(12deg)} }
      @keyframes needleRpm { 0%,100%{transform:rotate(-40deg)} 40%{transform:rotate(52deg)} 65%{transform:rotate(20deg)} }
      @keyframes dashflowV { to { stroke-dashoffset:-40 } }
      @keyframes blinkWheel { 0%,100%{fill:#22c55e;opacity:.9} 50%{opacity:.25} }
      @keyframes alertWheel { 0%,100%{fill:#f59e0b} 50%{fill:#ef4444} }
      @keyframes floatTab { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
      @keyframes ticker { 0%{opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{opacity:0} }
      .glowV{animation:breatheV 8s ease-in-out infinite}
      .nSpeed{transform-box:fill-box;transform-origin:50% 88%;animation:needleSpeed 7s ease-in-out infinite}
      .nRpm{transform-box:fill-box;transform-origin:50% 88%;animation:needleRpm 7s ease-in-out infinite .4s}
      .flowV{stroke-dasharray:6 10;animation:dashflowV 1.8s linear infinite}
      .w1{animation:blinkWheel 3s ease-in-out infinite}
      .w2{animation:blinkWheel 3s ease-in-out infinite .7s}
      .w3{animation:alertWheel 2.4s ease-in-out infinite}
      .w4{animation:blinkWheel 3s ease-in-out infinite 1.4s}
      .tab{transform-box:fill-box;transform-origin:center;animation:floatTab 6s ease-in-out infinite}
      .tick1{animation:ticker 6s ease-in-out infinite}
      .tick2{animation:ticker 6s ease-in-out infinite 3s}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="800" height="500" fill="url(#bgV)"/>
  <circle class="glowV" cx="420" cy="210" r="300" fill="url(#glowV)"/>

  <!-- Tablet / quadre digital -->
  <g class="tab">
    <rect x="150" y="60" width="420" height="270" rx="16" fill="var(--chakra-colors-ink-bg, #14110c)" stroke="var(--chakra-colors-ink-border, #4a4234)" stroke-width="2.5"/>
    <rect x="166" y="76" width="388" height="238" rx="8" fill="url(#screenV)" stroke="var(--chakra-colors-ink-border-subtle, #2e2a22)" stroke-width="1.5"/>
    <text x="188" y="102" fill="var(--chakra-colors-accent-emphasized, #F0B662)" font-family="ui-monospace,monospace" font-size="13" letter-spacing="3">VEHICLEOS</text>
    <circle cx="524" cy="98" r="4" fill="#22c55e"/>
    <text x="514" y="102" text-anchor="end" fill="var(--chakra-colors-ink-fg-muted, #A79F8E)" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1">CONECTADO</text>

    <!-- Gauge velocitat -->
    <g transform="translate(258,205)">
      <circle r="62" fill="none" stroke="var(--chakra-colors-ink-border-subtle, #2e2a22)" stroke-width="7"/>
      <path d="M -43.8 43.8 A 62 62 0 1 1 43.8 43.8" fill="none" stroke="var(--chakra-colors-accent-solid, #E8A23D)" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
      <line class="nSpeed" x1="0" y1="10" x2="0" y2="-46" stroke="var(--chakra-colors-accent-emphasized, #F0B662)" stroke-width="4" stroke-linecap="round"/>
      <circle r="6" fill="var(--chakra-colors-accent-emphasized, #F0B662)"/>
      <text y="34" text-anchor="middle" fill="var(--chakra-colors-ink-fg, #EDE6D6)" font-family="ui-monospace,monospace" font-size="20" font-weight="700">97</text>
      <text y="50" text-anchor="middle" fill="var(--chakra-colors-ink-fg-muted, #A79F8E)" font-family="ui-monospace,monospace" font-size="9" letter-spacing="2">KM/H</text>
    </g>

    <!-- Gauge rpm -->
    <g transform="translate(462,205)">
      <circle r="62" fill="none" stroke="var(--chakra-colors-ink-border-subtle, #2e2a22)" stroke-width="7"/>
      <path d="M -43.8 43.8 A 62 62 0 1 1 43.8 43.8" fill="none" stroke="var(--chakra-colors-accent-solid, #E8A23D)" stroke-width="7" stroke-linecap="round" opacity="0.65"/>
      <line class="nRpm" x1="0" y1="10" x2="0" y2="-46" stroke="var(--chakra-colors-accent-emphasized, #F0B662)" stroke-width="4" stroke-linecap="round"/>
      <circle r="6" fill="var(--chakra-colors-accent-emphasized, #F0B662)"/>
      <text y="34" text-anchor="middle" fill="var(--chakra-colors-ink-fg, #EDE6D6)" font-family="ui-monospace,monospace" font-size="20" font-weight="700">2140</text>
      <text y="50" text-anchor="middle" fill="var(--chakra-colors-ink-fg-muted, #A79F8E)" font-family="ui-monospace,monospace" font-size="9" letter-spacing="2">RPM</text>
    </g>

    <!-- avisos de telemetria -->
    <text class="tick1" x="188" y="300" fill="var(--chakra-colors-accent-emphasized, #F0B662)" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1">REFRIGERANTE 82°C · OK</text>
    <text class="tick2" x="532" y="300" text-anchor="end" fill="#fbbf24" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1">EGR · REVISAR</text>
  </g>

  <!-- Cotxe vista zenital -->
  <g transform="translate(628,70)">
    <rect x="0" y="0" width="110" height="230" rx="46" fill="var(--chakra-colors-ink-bg, #14110c)" stroke="var(--chakra-colors-ink-border, #4a4234)" stroke-width="2.5"/>
    <rect x="18" y="46" width="74" height="66" rx="12" fill="var(--chakra-colors-ink-subtle, #1d1913)" stroke="var(--chakra-colors-ink-border-subtle, #2e2a22)" stroke-width="1.5"/>
    <rect x="18" y="132" width="74" height="52" rx="10" fill="var(--chakra-colors-ink-subtle, #1d1913)" stroke="var(--chakra-colors-ink-border-subtle, #2e2a22)" stroke-width="1.5"/>
    <circle class="w1" cx="6" cy="58" r="7"/>
    <circle class="w2" cx="104" cy="58" r="7"/>
    <circle class="w3" cx="6" cy="180" r="7"/>
    <circle class="w4" cx="104" cy="180" r="7"/>
  </g>
  <line class="flowV" x1="570" y1="200" x2="628" y2="200" stroke="var(--chakra-colors-accent-dot, #CE8724)" stroke-width="2"/>

  <!-- Pipeline -->
  <g font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">
    <g transform="translate(60,410)">
      <rect width="120" height="44" rx="6" fill="var(--chakra-colors-ink-bg, #14110c)" stroke="var(--chakra-colors-ink-border, #4a4234)" stroke-width="2"/>
      <text x="60" y="27" fill="var(--chakra-colors-accent-emphasized, #F0B662)" letter-spacing="2">APLICACIÓN</text>
    </g>
    <line class="flowV" x1="180" y1="432" x2="235" y2="432" stroke="var(--chakra-colors-accent-dot, #CE8724)" stroke-width="2"/>
    <g transform="translate(235,410)">
      <rect width="90" height="44" rx="6" fill="var(--chakra-colors-ink-bg, #14110c)" stroke="var(--chakra-colors-ink-border, #4a4234)" stroke-width="2"/>
      <text x="45" y="27" fill="var(--chakra-colors-accent-emphasized, #F0B662)" letter-spacing="2">SDK</text>
    </g>
    <line class="flowV" x1="325" y1="432" x2="380" y2="432" stroke="var(--chakra-colors-accent-dot, #CE8724)" stroke-width="2"/>
    <g transform="translate(380,410)">
      <rect width="130" height="44" rx="6" fill="var(--chakra-colors-ink-bg, #14110c)" stroke="var(--chakra-colors-ink-border, #4a4234)" stroke-width="2"/>
      <text x="65" y="27" fill="var(--chakra-colors-accent-emphasized, #F0B662)" letter-spacing="2">SERVICIO</text>
    </g>
    <line class="flowV" x1="510" y1="432" x2="565" y2="432" stroke="var(--chakra-colors-accent-dot, #CE8724)" stroke-width="2"/>
    <g transform="translate(565,410)">
      <rect width="90" height="44" rx="6" fill="var(--chakra-colors-ink-bg, #14110c)" stroke="var(--chakra-colors-ink-border, #4a4234)" stroke-width="2"/>
      <text x="45" y="27" fill="var(--chakra-colors-accent-emphasized, #F0B662)" letter-spacing="2">OBD-II</text>
    </g>
    <line class="flowV" x1="655" y1="432" x2="700" y2="432" stroke="var(--chakra-colors-accent-dot, #CE8724)" stroke-width="2"/>
    <g transform="translate(700,410)">
      <rect width="80" height="44" rx="6" fill="var(--chakra-colors-ink-bg, #14110c)" stroke="var(--chakra-colors-ink-border, #4a4234)" stroke-width="2"/>
      <text x="40" y="27" fill="var(--chakra-colors-accent-emphasized, #F0B662)" letter-spacing="2">COCHE</text>
    </g>
    <text x="90" y="392" fill="var(--chakra-colors-ink-fg-muted, #A79F8E)" font-size="10" letter-spacing="2" text-anchor="start">READ-ONLY · LA PANTALLA NUNCA TOCA EL HARDWARE</text>
  </g>
</svg>
