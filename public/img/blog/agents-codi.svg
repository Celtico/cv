<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Columna de codi on les primeres línies són escrites a mà i la resta les emeten tres agents connectats per fils">
  <defs>
    <linearGradient id="agBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--chakra-colors-ink-bg, #14110c)"/>
      <stop offset="1" style="stop-color:var(--chakra-colors-ink-subtle, #1d1913)"/>
    </linearGradient>
    <radialGradient id="agGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color:var(--chakra-colors-accent-solid, #CE8724)" stop-opacity="0.55"/>
      <stop offset="1" style="stop-color:var(--chakra-colors-accent-solid, #CE8724)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="agScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--chakra-colors-accent-solid, #CE8724)" stop-opacity="0"/>
      <stop offset="0.5" style="stop-color:var(--chakra-colors-accent-solid, #CE8724)" stop-opacity="0.85"/>
      <stop offset="1" style="stop-color:var(--chakra-colors-accent-solid, #CE8724)" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes agBreathe { 0%,100%{opacity:.10} 50%{opacity:.20} }
      @keyframes agSweep   { 0%{transform:translateY(0)} 100%{transform:translateY(268px)} }
      @keyframes agEmit    { 0%,100%{opacity:.25} 40%{opacity:1} }
      @keyframes agFlow    { to { stroke-dashoffset:-28 } }
      @keyframes agCaret   { 0%,45%{opacity:1} 55%,100%{opacity:0} }
      .agGlow  { animation: agBreathe 9s ease-in-out infinite; }
      .agScan  { animation: agSweep 6s cubic-bezier(.4,0,.6,1) infinite; }
      .agNode  { animation: agEmit 3.6s ease-in-out infinite; }
      .agNode2 { animation-delay: 1.2s; }
      .agNode3 { animation-delay: 2.4s; }
      .agWire  { stroke-dasharray: 6 8; animation: agFlow 2.4s linear infinite; }
      .agCaret { animation: agCaret 1.1s steps(1) infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="800" height="500" fill="url(#agBg)"/>
  <circle class="agGlow" cx="620" cy="250" r="260" fill="url(#agGlow)" opacity="0.14"/>

  <!-- retícula de fons -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800"/>
    <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500"/>
  </g>

  <!-- ————— columna de codi ————— -->
  <g transform="translate(64 96)">
    <rect x="-16" y="-28" width="392" height="336" rx="2"
          fill="var(--chakra-colors-ink-bg, #14110c)" fill-opacity="0.72"
          stroke="var(--chakra-colors-ink-border, #4a4234)" stroke-width="1"/>

    <!-- capçalera de la làmina -->
    <text x="0" y="-8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" letter-spacing="2.4"
          fill="var(--chakra-colors-ink-fg-muted, #A79F8E)">MAIN.TS</text>
    <text x="360" y="-8" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" letter-spacing="2.4"
          fill="var(--chakra-colors-accent-solid, #CE8724)">3 / 14</text>

    <!-- canaló amb números de línia -->
    <g stroke="var(--chakra-colors-ink-border, #4a4234)" stroke-width="1" stroke-opacity="0.7">
      <path d="M22 8V296"/>
    </g>
    <g fill="var(--chakra-colors-ink-fg-muted, #A79F8E)" fill-opacity="0.45"
       font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" text-anchor="end">
      <text x="14" y="22">01</text><text x="14" y="42">02</text><text x="14" y="62">03</text>
      <text x="14" y="82">04</text><text x="14" y="102">05</text><text x="14" y="122">06</text>
      <text x="14" y="142">07</text><text x="14" y="162">08</text><text x="14" y="182">09</text>
      <text x="14" y="202">10</text><text x="14" y="222">11</text><text x="14" y="242">12</text>
      <text x="14" y="262">13</text><text x="14" y="282">14</text>
    </g>

    <!-- les tres primeres línies: escrites a mà -->
    <g fill="var(--chakra-colors-ink-fg-muted, #A79F8E)" fill-opacity="0.85">
      <rect x="38" y="14" width="196" height="7" rx="1"/>
      <rect x="38" y="34" width="248" height="7" rx="1"/>
      <rect x="52" y="54" width="150" height="7" rx="1"/>
    </g>

    <!-- la resta: emeses pels agents -->
    <g fill="var(--chakra-colors-accent-solid, #CE8724)">
      <rect x="52" y="74"  width="214" height="7" rx="1" opacity="0.75"/>
      <rect x="52" y="94"  width="286" height="7" rx="1" opacity="0.62"/>
      <rect x="66" y="114" width="172" height="7" rx="1" opacity="0.70"/>
      <rect x="66" y="134" width="238" height="7" rx="1" opacity="0.55"/>
      <rect x="52" y="154" width="264" height="7" rx="1" opacity="0.68"/>
      <rect x="52" y="174" width="196" height="7" rx="1" opacity="0.50"/>
      <rect x="66" y="194" width="290" height="7" rx="1" opacity="0.62"/>
      <rect x="66" y="214" width="146" height="7" rx="1" opacity="0.45"/>
      <rect x="52" y="234" width="252" height="7" rx="1" opacity="0.58"/>
      <rect x="52" y="254" width="208" height="7" rx="1" opacity="0.42"/>
      <rect x="38" y="274" width="120" height="7" rx="1" opacity="0.52"/>
    </g>

    <!-- cursor -->
    <rect class="agCaret" x="164" y="272" width="8" height="11"
          fill="var(--chakra-colors-accent-solid, #CE8724)"/>

    <!-- passada de lectura -->
    <g class="agScan">
      <rect x="30" y="10" width="330" height="2" fill="url(#agScan)"/>
    </g>
  </g>

  <!-- ————— agents ————— -->
  <g transform="translate(520 96)">
    <g stroke="var(--chakra-colors-accent-solid, #CE8724)" stroke-opacity="0.45" stroke-width="1" fill="none">
      <path class="agWire" d="M-56 60 C -20 60, 8 44, 40 44"/>
      <path class="agWire" d="M-56 150 C -20 150, 8 142, 40 142"/>
      <path class="agWire" d="M-56 236 C -20 236, 8 240, 40 240"/>
    </g>

    <g>
      <g class="agNode" transform="translate(40 44)">
        <circle r="26" fill="var(--chakra-colors-ink-bg, #14110c)"
                stroke="var(--chakra-colors-accent-solid, #CE8724)" stroke-width="1.5"/>
        <circle r="6" fill="var(--chakra-colors-accent-solid, #CE8724)"/>
      </g>
      <g class="agNode agNode2" transform="translate(40 142)">
        <circle r="26" fill="var(--chakra-colors-ink-bg, #14110c)"
                stroke="var(--chakra-colors-accent-solid, #CE8724)" stroke-width="1.5"/>
        <circle r="6" fill="var(--chakra-colors-accent-solid, #CE8724)"/>
      </g>
      <g class="agNode agNode3" transform="translate(40 240)">
        <circle r="26" fill="var(--chakra-colors-ink-bg, #14110c)"
                stroke="var(--chakra-colors-accent-solid, #CE8724)" stroke-width="1.5"/>
        <circle r="6" fill="var(--chakra-colors-accent-solid, #CE8724)"/>
      </g>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2"
       fill="var(--chakra-colors-ink-fg-muted, #A79F8E)" fill-opacity="0.75">
      <text x="78" y="48">AGENT 01</text>
      <text x="78" y="146">AGENT 02</text>
      <text x="78" y="244">AGENT 03</text>
    </g>
  </g>

  <!-- peu -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.6"
     fill="var(--chakra-colors-ink-fg-muted, #A79F8E)" fill-opacity="0.55">
    <text x="64" y="452">QUI ESCRIU EL CODI</text>
    <text x="736" y="452" text-anchor="end"
          fill="var(--chakra-colors-accent-solid, #CE8724)" fill-opacity="0.9">I QUI EN RESPON</text>
  </g>
  <path d="M64 432H736" stroke="var(--chakra-colors-ink-border, #4a4234)" stroke-width="1" stroke-opacity="0.6"/>
</svg>
