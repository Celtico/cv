<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="FABRIK: nesting, QR y trazabilidad de piezas">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171208"/>
      <stop offset="1" stop-color="#0d0b06"/>
    </linearGradient>
    <radialGradient id="glowF" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes breatheF { 0%,100%{opacity:.10} 50%{opacity:.22} }
      @keyframes scan { 0%{transform:translateY(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(212px);opacity:0} }
      @keyframes hl { 0%,100%{stroke:#3b3320;fill:#241d0f} 50%{stroke:#f5b73d;fill:#3a2c12} }
      @keyframes qrpulse { 0%,100%{opacity:.35} 50%{opacity:1} }
      @keyframes progress { 0%{offset-distance:0%} 100%{offset-distance:100%} }
      @keyframes floatCube { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes spin { 0%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} 100%{transform:rotate(-8deg)} }
      @keyframes dashflowF { to { stroke-dashoffset:-40 } }
      .glowF{animation:breatheF 9s ease-in-out infinite}
      .scan{animation:scan 4.5s ease-in-out infinite}
      .p1{animation:hl 5s ease-in-out infinite}
      .p2{animation:hl 5s ease-in-out infinite 1s}
      .p3{animation:hl 5s ease-in-out infinite 2s}
      .p4{animation:hl 5s ease-in-out infinite 3s}
      .p5{animation:hl 5s ease-in-out infinite 4s}
      .qr{animation:qrpulse 3s ease-in-out infinite}
      .runner{offset-path:path('M120,430 H307 H494 H680');animation:progress 5s ease-in-out infinite}
      .cube{transform-box:fill-box;transform-origin:center;animation:floatCube 6s ease-in-out infinite}
      .cubeInner{transform-box:fill-box;transform-origin:center;animation:spin 8s ease-in-out infinite}
      .flowF{stroke-dasharray:6 10;animation:dashflowF 1.8s linear infinite}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="800" height="500" fill="url(#bgF)"/>
  <circle class="glowF" cx="240" cy="200" r="300" fill="url(#glowF)"/>

  <!-- Nesting board -->
  <g transform="translate(70,80)">
    <rect width="330" height="212" rx="10" fill="#0f0d08" stroke="#463a22" stroke-width="2"/>
    <text x="330" y="-10" text-anchor="end" fill="#8a7550" font-family="system-ui,sans-serif" font-size="13" letter-spacing="1">NESTING · TABLERO</text>
    <!-- pieces -->
    <rect class="p1" x="16"  y="16"  width="120" height="80" rx="5" stroke-width="2"/>
    <rect class="p2" x="150" y="16"  width="80"  height="120" rx="5" stroke-width="2"/>
    <rect class="p3" x="244" y="16"  width="70"  height="60"  rx="5" stroke-width="2"/>
    <rect class="p4" x="16"  y="110" width="120" height="86" rx="5" stroke-width="2"/>
    <rect class="p5" x="244" y="90"  width="70"  height="106" rx="5" stroke-width="2"/>
    <!-- scan line -->
    <g clip-path="inset(0 round 10)">
      <rect class="scan" x="4" y="4" width="322" height="3" fill="#ffd479" opacity="0"/>
    </g>
  </g>

  <!-- QR code -->
  <g class="qr" transform="translate(470,90)">
    <rect x="-14" y="-14" width="188" height="188" rx="12" fill="#0f0d08" stroke="#463a22" stroke-width="2"/>
    <g fill="#f3e2c0">
      <rect x="0" y="0" width="52" height="52"/><rect x="10" y="10" width="32" height="32" fill="#0f0d08"/><rect x="19" y="19" width="14" height="14" fill="#f3e2c0"/>
      <rect x="108" y="0" width="52" height="52"/><rect x="118" y="10" width="32" height="32" fill="#0f0d08"/><rect x="127" y="19" width="14" height="14" fill="#f3e2c0"/>
      <rect x="0" y="108" width="52" height="52"/><rect x="10" y="118" width="32" height="32" fill="#0f0d08"/><rect x="19" y="127" width="14" height="14" fill="#f3e2c0"/>
      <rect x="70" y="14" width="12" height="12"/><rect x="88" y="14" width="12" height="12"/><rect x="70" y="32" width="12" height="12"/>
      <rect x="70" y="70" width="12" height="12"/><rect x="88" y="70" width="12" height="12"/><rect x="106" y="70" width="12" height="12"/><rect x="124" y="70" width="12" height="12"/><rect x="142" y="70" width="12" height="12"/>
      <rect x="70" y="88" width="12" height="12"/><rect x="106" y="88" width="12" height="12"/><rect x="142" y="88" width="12" height="12"/>
      <rect x="70" y="106" width="12" height="12"/><rect x="88" y="106" width="12" height="12"/><rect x="124" y="106" width="12" height="12"/>
      <rect x="88" y="124" width="12" height="12"/><rect x="106" y="124" width="12" height="12"/><rect x="142" y="124" width="12" height="12"/>
      <rect x="70" y="142" width="12" height="12"/><rect x="106" y="142" width="12" height="12"/><rect x="124" y="142" width="12" height="12"/>
    </g>
  </g>

  <!-- 3D STEP cube.
       El <g> exterior només posiciona: el `transform` de CSS de l'animació
       sobreescriuria l'atribut `transform`, i el cub saltaria a l'origen. -->
  <g transform="translate(660,300)">
    <g class="cube">
      <g class="cubeInner">
        <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="#1c1608" stroke="#f5b73d" stroke-width="2"/>
        <path d="M0,-34 L0,0 L30,17 M0,0 L-30,17" fill="none" stroke="#c9922e" stroke-width="1.6" opacity="0.8"/>
      </g>
      <text x="0" y="58" text-anchor="middle" fill="#a98b4e" font-family="ui-monospace,monospace" font-size="12">STEP 3D</text>
    </g>
  </g>

  <!-- Stage flow: Etiquetar -> Mecanitzar -> Laminar -> Muntar -->
  <path class="flowF" d="M120,430 H680" fill="none" stroke="#8a7550" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <circle cx="120" cy="430" r="9" fill="#241d0f" stroke="#f5b73d" stroke-width="2"/>
    <text x="120" y="462" fill="#e9cf9a">Etiquetar</text>
    <circle cx="307" cy="430" r="9" fill="#241d0f" stroke="#ff9d6e" stroke-width="2"/>
    <text x="307" y="462" fill="#ffd0b8">Mecanitzar</text>
    <circle cx="494" cy="430" r="9" fill="#241d0f" stroke="#5fd9ff" stroke-width="2"/>
    <text x="494" y="462" fill="#bfe9ff">Laminar</text>
    <circle cx="680" cy="430" r="9" fill="#241d0f" stroke="#7CFC9B" stroke-width="2"/>
    <text x="680" y="462" fill="#c3f5d2">Muntar</text>
  </g>
  <circle class="runner" r="6" fill="#ffd479"/>
</svg>
